name: Validar infraestructura

on:
  push:
    branches: ["main"]
    paths:
      - "terraform/**"
      - ".github/workflows/infra.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "terraform/**"
      - ".github/workflows/infra.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Terraform y Checkov
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.0"

      - name: Revisar formato
        run: terraform fmt -check -recursive
        working-directory: terraform

      - name: Inicializar sin backend
        run: terraform init -backend=false
        working-directory: terraform

      - name: Validar Terraform
        run: terraform validate
        working-directory: terraform

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Checkov
        run: python -m pip install checkov

      - name: Revisar seguridad
        run: checkov -d terraform --framework terraform