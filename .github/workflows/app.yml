name: Validar API y Docker

on:
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - ".github/workflows/app.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "app/**"
      - ".github/workflows/app.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Construir y revisar seguridad
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Preparar reportes
        run: mkdir -p evidence

      - name: Construir imagen
        id: build
        run: |
          docker build --pull -t parrilleros-api:${{ github.sha }} ./app
          docker save -o evidence/image.tar parrilleros-api:${{ github.sha }}

      - name: Revisar dependencias
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/app:/source:ro" \
            -v "$GITHUB_WORKSPACE/evidence:/reports" \
            aquasec/trivy:0.67.2 fs \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --format json \
            --output /reports/dependencies.json \
            /source

      - name: Revisar imagen Docker
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/evidence:/reports" \
            aquasec/trivy:0.67.2 image \
            --input /reports/image.tar \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --format json \
            --output /reports/image.json

      - name: Guardar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-seguridad-api
          path: evidence/*.json
          if-no-files-found: warn