# Solo para desarrollo local: API + DynamoDB Local (sin tocar AWS).
# Las credenciales de abajo son FALSAS; DynamoDB Local las exige pero no las valida.
services:
  dynamodb:
    image: amazon/dynamodb-local:2.6.1
    command: "-jar DynamoDBLocal.jar -inMemory -sharedDb"
    ports:
      - "8000:8000"

  init-table:
    image: amazon/aws-cli:2.27.0
    depends_on: [dynamodb]
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        sleep 3 &&
        aws dynamodb create-table --endpoint-url http://dynamodb:8000
        --table-name items
        --attribute-definitions AttributeName=id,AttributeType=S
        --key-schema AttributeName=id,KeyType=HASH
        --billing-mode PAY_PER_REQUEST || true

  api:
    build: .
    depends_on: [init-table]
    ports:
      - "${API_PORT:-8080}:8080"   # si 8080 está ocupado: API_PORT=8088 docker compose up
    environment:
      TABLE_NAME: items
      AWS_REGION: us-east-1
      APP_VERSION: local
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
